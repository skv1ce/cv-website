<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 – Seite nicht gefunden · Bohdan Krasokha</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#000000">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23000'/%3E%3Cpath d='M32 10c12 0 20 8 20 18s-8 16-16 16-12-6-12-11 4-8 8-8 5 3 5 5' fill='none' stroke='%23fff' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
    <style>
        /* Absolute paths: GitHub Pages shows this page for any missing address */
        @font-face { font-family: 'Geist'; font-weight: 100 900; font-display: swap; src: url('/cv-website/fonts/geist-latin-wght-normal.woff2') format('woff2'); }
        @font-face { font-family: 'Geist Mono'; font-weight: 400; font-display: swap; src: url('/cv-website/fonts/geist-mono-latin-400-normal.woff2') format('woff2'); }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            display: grid; place-items: center; padding: 1.5rem;
            background: #000; color: #D1D1D6; font-family: 'Geist', system-ui, sans-serif;
        }
        main { width: min(40rem, 100%); }
        .av { display: block; width: 72px; height: 72px; border-radius: 50%; margin-bottom: 1.25rem; box-shadow: 0 0 0 1px rgba(255,255,255,.25); }
        .big {
            margin: 0; font-size: clamp(5rem, 22vw, 10rem); font-weight: 600; letter-spacing: -.06em; line-height: .9;
            background: linear-gradient(180deg, #fff 25%, #6e6e73); -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        h1 { margin: 1rem 0 0; font-size: 1.5rem; font-weight: 600; color: #fff; letter-spacing: -.02em; }
        .term {
            margin-top: 1.75rem; padding: 1.1rem 1.25rem; border-radius: 16px;
            background: rgba(10,10,12,.9); box-shadow: inset 0 0 0 1px rgba(255,255,255,.13);
            font-family: 'Geist Mono', Consolas, monospace; font-size: .9rem; line-height: 1.8; white-space: pre-wrap; word-break: break-word;
        }
        .term .c { color: #fff; }
        .term .d { color: #8E8E93; }
        .caret { display: inline-block; width: .55em; height: 1.05em; vertical-align: -.2em; background: #fff; animation: b 1s steps(1) infinite; }
        @keyframes b { 50% { opacity: 0; } }
        a.btn {
            display: inline-flex; margin-top: 1.75rem; padding: .85rem 1.5rem; border-radius: 999px;
            background: #fff; color: #000; font-weight: 600; text-decoration: none;
        }
        a.btn:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }
        .en { margin-top: 1.25rem; font-size: .9rem; color: #8E8E93; }
    </style>
</head>
<body>
    <main>
        <img class="av" src="/cv-website/img/avatar-240.webp" width="72" height="72" alt="">
        <p class="big" aria-hidden="true">404</p>
        <h1>Diese Seite gibt es nicht – mich schon.</h1>
        <div class="term"><span class="c">gast@bohdan:~$ cd <span id="path">/seite</span></span>
<span class="d">bash: cd: Datei oder Verzeichnis nicht gefunden</span>
<span class="c">gast@bohdan:~$ ping bohdan</span>
64 bytes from bohdan: time=0.4 ms  <span class="d">– erreichbar ✓</span>
<span class="c">gast@bohdan:~$ </span><span class="caret"></span></div>
        <a class="btn" href="/cv-website/">Zurück zur Startseite</a>
        <p class="en">Page not found – but I can be found. <a href="/cv-website/" style="color:#fff">Back to the start</a>.</p>
    </main>
    <script>
        // Show the address that was actually typed, shortened
        var p = location.pathname.replace(/^\/cv-website/, '') || '/';
        document.getElementById('path').textContent = p.length > 32 ? p.slice(0, 31) + '…' : p;
    </script>
</body>
</html>
